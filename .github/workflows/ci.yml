name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SwiftLint config
        run: curl -fsSL https://raw.githubusercontent.com/Syzygy-Hub/.github/main/engineering/tooling/ios/.swiftlint.yml -o .swiftlint.yml

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml

      - name: Build
        run: swift build

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Coverage summary
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          xcrun llvm-cov report \
            "${BIN_PATH}/SyzygyServicesPackageTests.xctest/Contents/MacOS/SyzygyServicesPackageTests" \
            -instr-profile "$(find .build -name default.profdata -type f | head -1)" \
            -ignore-filename-regex '\.build|Tests' \
          >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
